
name: Generate Contribution Snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate dark snake
        uses: Platane/snk@v3
        with:
          github_user_name: BhargavHathwar
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300F7FF&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
